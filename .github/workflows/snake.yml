name: Snake

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: WRECKERKNIGHT
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%23F7B733&color_dots=%23241A24,%233d2f45,%238A5F3D,%23D4A373,%23FAEDCD

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
