name: Status Bar

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: status-bar
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh system status bar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build status bar with live Spotify state
        run: |
          python3 - <<'PY'
          import re, urllib.request, datetime, pathlib

          UID = "31y7htruozzrnh2fraukjakcg4ii"
          URL = ("https://spotify-github-profile.kittinanx.com/api/view"
                 f"?uid={UID}&cover_image=false&theme=default&show_offline=true"
                 "&background_color=121212&interchange=false&profanity=false&hide_remaster=false")

          GREEN, PINK, CYAN, AMBER, RED = "#27C93F", "#F700FF", "#00E5FF", "#F7B733", "#FF5C57"

          def esc(s):
              return s.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")

          def fetch_track():
              req = urllib.request.Request(URL, headers={"User-Agent": "status-bar"})
              svg = urllib.request.urlopen(req, timeout=20).read().decode("utf-8", "replace")
              artist = re.search(r'class="artist">\s*(.*?)\s*</div>', svg, re.S)
              song = re.search(r'class="song">\s*(.*?)\s*</div>', svg, re.S)
              playing = 'class="playing"' in svg
              if playing and artist and song:
                  return True, artist.group(1).strip(), song.group(1).strip()
              return False, "", ""

          def marquee_text(text, region_w, char_w=9.6):
              base = f" {text} "
              reps = max(1, int((region_w / (len(base) * char_w)) + 1))
              return base * reps

          import random
          def eq_bars(x0, n, color, dim=False):
              out, rng = [], random.Random(42)
              for i in range(n):
                  x = x0 + i * 11
                  vals = [rng.choice([5, 9, 14, 19, 23]) for _ in range(6)]
                  hv = ";".join(map(str, vals))
                  yv = ";".join(str(46 - h) for h in vals)
                  dur = round(rng.uniform(0.65, 1.15), 2)
                  op = "0.45" if dim else "1"
                  out.append(
                      f'<rect x="{x}" y="{46 - vals[0]}" width="5" height="{vals[0]}" fill="{color}" fill-opacity="{op}">'
                      f'<animate attributeName="height" values="{hv}" dur="{dur}s" begin="{-0.09 * i:.2f}s" repeatCount="indefinite"/>'
                      f'<animate attributeName="y" values="{yv}" dur="{dur}s" begin="{-0.09 * i:.2f}s" repeatCount="indefinite"/>'
                      f"</rect>"
                  )
              return "\n      ".join(out)

          try:
              playing, artist, song = fetch_track()
          except Exception as e:
              print("fetch failed, keeping previous bar:", e)
              raise SystemExit(0)

          now = datetime.datetime.now(datetime.timezone.utc).strftime("%H:%M")
          W, H = 1440, 56
          mid_x, mid_w = 385, 660
          right_x = 1070

          status_txt, status_col = "ONLINE", GREEN
          if playing:
              track = f"NOW PLAYING &#9656; {esc(artist)} &#8212; {esc(song)} &#9656; SPOTIFY.LIVE &#9656;"
              track_col, eq_col, eq_dim = CYAN, AMBER, False
              state_line = "AUDIO.STREAM.ACTIVE"
          else:
              track = ("SPOTIFY.IDLE &#9656; NOTHING.PLAYING.RIGHT.NOW &#9656; QUEUE.OPEN "
                       f"&#9656; LAST.SYNC {esc(now)} UTC &#9656;")
              track_col, eq_col, eq_dim = AMBER, "#444c56", True
              state_line = "AUDIO.STREAM.IDLE"

          mtxt = esc(marquee_text(track.replace("&#9656;", "\u25b8").replace("&#8212;", "\u2014").replace("&amp;", "&"), mid_w))

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}" role="img" aria-label="System status bar">
            <rect width="{W}" height="{H}" fill="#0d1117"/>
            <line x1="0" y1="1" x2="{W}" y2="1" stroke="{PINK}" stroke-opacity="0.55"/>
            <line x1="0" y1="{H - 1}" x2="{W}" y2="{H - 1}" stroke="{CYAN}" stroke-opacity="0.55"/>
            <clipPath id="mid"><rect x="{mid_x}" y="0" width="{mid_w}" height="{H}"/></clipPath>

            <!-- LEFT: system status -->
            <g font-family="'Courier New',monospace">
              <circle cx="28" cy="28" r="6" fill="{status_col}">
                <animate attributeName="opacity" values="1;0.35;1" dur="1.3s" repeatCount="indefinite"/>
              </circle>
              <circle cx="28" cy="28" r="3.2" fill="{status_col}"/>
              <text x="44" y="34" font-size="19" font-weight="bold" fill="{status_col}">SYSTEM.{status_txt}</text>
              <line x1="368" y1="10" x2="368" y2="{H - 10}" stroke="#30363d"/>
            </g>

            <!-- MIDDLE: now playing -->
            <g font-family="'Courier New',monospace" clip-path="url(#mid)">
                {eq_bars(mid_x + 8, 9, eq_col, eq_dim)}
                <text x="{mid_x + 120}" y="34" font-size="19" font-weight="bold" fill="{track_col}">{mtxt}</text>
                <animateTransform attributeName="transform" type="translate" from="0 0" to="{-mid_w} 0" dur="18s" repeatCount="indefinite"/>
            </g>
            <g font-family="'Courier New',monospace" clip-path="url(#mid)">
                <text x="{mid_x + 120 + mid_w}" y="34" font-size="19" font-weight="bold" fill="{track_col}">{mtxt}</text>
                <animateTransform attributeName="transform" type="translate" from="0 0" to="{-mid_w} 0" dur="18s" repeatCount="indefinite"/>
            </g>
            <line x1="{right_x}" y1="10" x2="{right_x}" y2="{H - 10}" stroke="#30363d"/>

            <!-- RIGHT: live feed -->
            <g font-family="'Courier New',monospace">
              <circle cx="{right_x + 26}" cy="28" r="6" fill="{RED}">
                <animate attributeName="opacity" values="1;0;1" dur="1s" calcMode="discrete" repeatCount="indefinite"/>
              </circle>
              <text x="{right_x + 40}" y="34" font-size="19" font-weight="bold" fill="{PINK}">{state_line}</text>
              <rect x="{right_x + 300}" y="16" width="11" height="22" fill="{CYAN}">
                <animate attributeName="opacity" values="1;0;1" dur="0.9s" calcMode="discrete" repeatCount="indefinite"/>
              </rect>
            </g>
          </svg>
          '''

          pathlib.Path("assets/status-bar.svg").write_text(svg, encoding="utf-8")
          print(f"bar built -> playing={playing} track='{artist} - {song}' sync={now}")
          PY

      - name: Commit refreshed bar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/status-bar.svg
          if git diff --cached --quiet; then
            echo "No change to bar"
          else
            git commit -m "chore(live): refresh system status bar [skip ci]"
            git push
          fi
