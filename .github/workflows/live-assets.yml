name: Live Assets

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-assets
  cancel-in-progress: true

jobs:
  tray:
    name: Bottom system tray (Spotify + telemetry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build bar with live Spotify state + repo stats
        run: |
          python3 - <<'PY'
          import json, random, re, urllib.request, datetime, pathlib

          UID = "31y7htruozzrnh2fraukjakcg4ii"
          SPOTIFY_URL = ("https://spotify-github-profile.kittinanx.com/api/view"
                         f"?uid={UID}&cover_image=false&theme=default&show_offline=true"
                         "&background_color=121212&interchange=false&profanity=false&hide_remaster=false")
          GH_USER = "WRECKERKNIGHT"

          GREEN, PINK, CYAN, AMBER, RED = "#27C93F", "#F700FF", "#00E5FF", "#F7B733", "#FF5C57"

          def esc(s):
              return s.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")

          def fetch_track():
              req = urllib.request.Request(SPOTIFY_URL, headers={"User-Agent": "bottom-bar"})
              svg = urllib.request.urlopen(req, timeout=20).read().decode("utf-8", "replace")
              artist = re.search(r'class="artist">\s*(.*?)\s*</div>', svg, re.S)
              song = re.search(r'class="song">\s*(.*?)\s*</div>', svg, re.S)
              if 'class="playing"' in svg and artist and song:
                  return True, artist.group(1).strip(), song.group(1).strip()
              return False, "", ""

          def fetch_stats():
              token = os.environ.get("GH_TOKEN")
              def get(url):
                  headers = {"User-Agent": "bottom-bar", "Accept": "application/vnd.github+json"}
                  if token:
                      headers["Authorization"] = f"Bearer {token}"
                  req = urllib.request.Request(url, headers=headers)
                  return json.load(urllib.request.urlopen(req))

              import os
              user = get(f"https://api.github.com/users/{GH_USER}")
              repos, page = [], 1
              while True:
                  batch = get(f"https://api.github.com/users/{GH_USER}/repos?per_page=100&page={page}")
                  if not batch:
                      break
                  repos.extend(batch)
                  page += 1
              return user["public_repos"], sum(r["stargazers_count"] for r in repos), user["followers"]

          def marquee_text(text, region_w, char_w=9.6):
              base = f" {text} "
              reps = max(1, int((region_w / (len(base) * char_w)) + 1))
              return base * reps

          def eq_bars(x0, n, color):
              out, rng = [], random.Random(7)
              for i in range(n):
                  x = x0 + i * 11
                  vals = [rng.choice([5, 9, 14, 19, 23]) for _ in range(6)]
                  hv = ";".join(map(str, vals))
                  yv = ";".join(str(46 - h) for h in vals)
                  dur = round(rng.uniform(0.65, 1.15), 2)
                  out.append(
                      f'<rect x="{x}" y="{46 - vals[0]}" width="5" height="{vals[0]}" fill="{color}">'
                      f'<animate attributeName="height" values="{hv}" dur="{dur}s" begin="{-0.09 * i:.2f}s" repeatCount="indefinite"/>'
                      f'<animate attributeName="y" values="{yv}" dur="{dur}s" begin="{-0.09 * i:.2f}s" repeatCount="indefinite"/>'
                      f"</rect>"
                  )
              return "\n      ".join(out)

          try:
              playing, artist, song = fetch_track()
          except Exception as e:
              print("spotify fetch failed, keeping previous bar:", e)
              raise SystemExit(0)

          try:
              repos, stars, followers = fetch_stats()
          except Exception as e:
              print("stats fetch failed:", e)
              repos, stars, followers = 18, 24, 2

          now = datetime.datetime.now(datetime.timezone.utc).strftime("%d.%m %H:%M")

          W, H = 1440, 56
          clip_x, clip_w = 130, 470
          tray_x = 640

          if playing:
              track = f"NOW PLAYING \u25b8 {artist} \u2014 {song}"
              track_col, eq_col = CYAN, AMBER
          else:
              track = f"SPOTIFY.IDLE \u25b8 NOTHING.PLAYING \u25b8 QUEUE.OPEN \u25b8 SYNC {now} UTC"
              track_col, eq_col = AMBER, "#444c56"

          mtxt = esc(marquee_text(track, clip_w))

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}" role="img" aria-label="System tray bar: now playing, online status and repo telemetry">
            <rect width="{W}" height="{H}" fill="#0d1117"/>
            <line x1="0" y1="1" x2="{W}" y2="1" stroke="{PINK}" stroke-opacity="0.55"/>
            <line x1="0" y1="{H - 1}" x2="{W}" y2="{H - 1}" stroke="{CYAN}" stroke-opacity="0.55"/>
            <clipPath id="media"><rect x="{clip_x}" y="0" width="{clip_w}" height="{H}"/></clipPath>

            <!-- MEDIA PLAYER -->
            <g font-family="'Courier New',monospace" clip-path="url(#media)">
                {eq_bars(16, 9, eq_col)}
                <text x="{clip_x + 10}" y="34" font-size="19" font-weight="bold" fill="{track_col}">{mtxt}</text>
                <animateTransform attributeName="transform" type="translate" from="0 0" to="{-clip_w} 0" dur="16s" repeatCount="indefinite"/>
            </g>
            <g font-family="'Courier New',monospace" clip-path="url(#media)">
                <text x="{clip_x + 10 + clip_w}" y="34" font-size="19" font-weight="bold" fill="{track_col}">{mtxt}</text>
                <animateTransform attributeName="transform" type="translate" from="0 0" to="{-clip_w} 0" dur="16s" repeatCount="indefinite"/>
            </g>
            <line x1="{tray_x - 20}" y1="10" x2="{tray_x - 20}" y2="{H - 10}" stroke="#30363d"/>

            <!-- SYSTEM TRAY -->
            <g font-family="'Courier New',monospace" font-size="17" font-weight="bold">
              <circle cx="{tray_x + 22}" cy="28" r="6" fill="{GREEN}">
                <animate attributeName="opacity" values="1;0.35;1" dur="1.3s" repeatCount="indefinite"/>
              </circle>
              <circle cx="{tray_x + 22}" cy="28" r="3" fill="{GREEN}"/>
              <text x="{tray_x + 38}" y="34" fill="{GREEN}">ONLINE</text>

              <line x1="{tray_x + 122}" y1="12" x2="{tray_x + 122}" y2="{H - 12}" stroke="#30363d"/>
              <text x="{tray_x + 142}" fill="{CYAN}">REPOS:{repos}</text>

              <text x="{tray_x + 262}" fill="{AMBER}">&#9733;:{stars}</text>

              <text x="{tray_x + 330}" fill="{PINK}">FOLLOWERS:{followers}</text>

              <line x1="{tray_x + 492}" y1="12" x2="{tray_x + 492}" y2="{H - 12}" stroke="#30363d"/>
              <circle cx="{tray_x + 516}" cy="28" r="5" fill="{RED}">
                <animate attributeName="opacity" values="1;0;1" dur="1s" calcMode="discrete" repeatCount="indefinite"/>
              </circle>
              <text x="{tray_x + 530}" fill="{PINK}">LIVE</text>
              <rect x="{tray_x + 580}" y="18" width="9" height="19" fill="{CYAN}">
                <animate attributeName="opacity" values="1;0;1" dur="0.9s" calcMode="discrete" repeatCount="indefinite"/>
              </rect>

              <text x="{W - 14}" y="34" text-anchor="end" fill="#8d7b94">IST.UTC+05:30</text>
            </g>
          </svg>
          '''

          pathlib.Path("assets/bottom-bar.svg").write_text(svg, encoding="utf-8")
          print(f"bar built -> playing={playing} track='{artist} - {song}' repos={repos} stars={stars} followers={followers}")
          PY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit refreshed tray
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/bottom-bar.svg
          if git diff --cached --quiet; then
            echo "No change to tray"
          else
            git commit -m "chore(live): refresh bottom system tray [skip ci]"
            git push
          fi

  active-hours:
    name: Active hours from real commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build chart from commit timestamps
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, datetime, pathlib

          USER = "WRECKERKNIGHT"
          TZ_OFFSET = 5.5  # IST

          GOLD_HEX = "#F7B733"

          def get(url):
              headers = {"User-Agent": "active-hours", "Accept": "application/vnd.github+json"}
              token = os.environ.get("GH_TOKEN")
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              req = urllib.request.Request(url, headers=headers)
              return json.load(urllib.request.urlopen(req))

          def commit_histogram():
              hist = [0] * 24
              for page in (1, 2, 3):
                  try:
                      events = get(f"https://api.github.com/users/{USER}/events/public?per_page=100&page={page}")
                  except Exception as e:
                      print("events page failed:", e)
                      break
                  if not events:
                      break
                  for ev in events:
                      if ev.get("type") != "PushEvent":
                          continue
                      size = ev.get("payload", {}).get("size", 0) or len(ev.get("payload", {}).get("commits", []))
                      ts = datetime.datetime.fromisoformat(ev["created_at"].replace("Z", "+00:00"))
                      local_hour = int((ts + datetime.timedelta(hours=TZ_OFFSET)).hour)
                      hist[local_hour] += max(size, 1)
              return hist

          def build_svg(hist):
              W, H = 1100, 260
              x0, x1 = 60, 1040
              s = (x1 - x0) / 24.0

              def hx(h):
                  return x0 + h * s

              peak = lambda h: h >= 15 or h <= 2
              mx = max(hist) or 1

              bars = []
              for h in range(24):
                  frac = hist[h] / mx
                  height = 26 + round(frac * 90)
                  y = 212 - height
                  col = "url(#peakBar)" if peak(h) else "#3d2f45"
                  op = "" if peak(h) else ' opacity="0.55"'
                  anim = ""
                  if peak(h):
                      begin = round((h % 12) * 0.11, 2)
                      anim = f'<animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" begin="{begin}s" repeatCount="indefinite"/>'
                  bars.append(
                      f'    <rect x="{hx(h) + 9:.1f}" y="{y}" width="22" height="{height}" rx="6" fill="{col}"{op}>{anim}</rect>'
                  )
              bars = "\n".join(bars)

              shading_l = f'<rect x="{x0}" y="84" width="{3 * s:.1f}" height="128" fill="#F7B733" opacity="0.07" rx="8"/>'
              shading_r = f'<rect x="{hx(15):.1f}" y="84" width="{(24 - 15) * s:.1f}" height="128" fill="#F7B733" opacity="0.07" rx="8"/>'

              grid = "\n".join(
                  f'    <line x1="{hx(h):.0f}" y1="86" x2="{hx(h):.0f}" y2="212"/>' for h in (0, 6, 12, 18, 24)
              )

              labels = ""
              for h in range(0, 24, 3):
                  gold = ' fill="#F7B733" font-weight="700"' if h in (15, 3) else ""
                  labels += f'    <text x="{hx(h) + 20.4:.1f}" y="238"{gold}>{h:02d}</text>\n'

              total = sum(hist)
              now = datetime.datetime.now(datetime.timezone.utc).strftime("%d.%m")

              return f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {W} {H}">
                <defs>
                  <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#0E0A12"/>
                    <stop offset="100%" stop-color="#1A1220"/>
                  </linearGradient>
                  <linearGradient id="peakBar" x1="0" y1="1" x2="0" y2="0">
                    <stop offset="0%" stop-color="#B98B56"/>
                    <stop offset="100%" stop-color="#F7B733"/>
                  </linearGradient>
                  <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#F7B733"/>
                    <stop offset="100%" stop-color="#FAEDCD"/>
                  </linearGradient>
                  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
                    <feGaussianBlur stdDeviation="5" result="b"/>
                    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
                  </filter>
                </defs>

                <rect x="5" y="5" width="1090" height="250" rx="26" fill="url(#bg2)" stroke="#2b2033" stroke-width="2"/>

                <text x="70" y="54" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="38" font-weight="900" letter-spacing="7" fill="url(#txt)" filter="url(#glow)">ACTIVE HOURS</text>
                <text x="1030" y="50" font-family="ui-monospace,Menlo,monospace" font-size="20" letter-spacing="3" fill="#00E5FF" text-anchor="end">ESTIMATED FROM COMMITS &#183; N={total}</text>

                <line x1="70" y1="72" x2="1030" y2="72" stroke="#33253c" stroke-width="1"/>

                <!-- peak zone shading 15:00-03:00 -->
                {shading_l}
                {shading_r}

                <!-- grid lines -->
                <g stroke="#241A24" stroke-width="1">
              {grid}
                </g>
                <line x1="{x0}" y1="212" x2="{x1}" y2="212" stroke="#3d2f45" stroke-width="1.5"/>

                <!-- hourly commit volume (IST), synced {now} -->
                <g filter="url(#glow)" id="bars">
              {bars}
                </g>

                <!-- sweeping now-cursor -->
                <line y1="86" y2="212" stroke="#00E5FF" stroke-width="2" opacity="0.7" filter="url(#glow)">
                  <animate attributeName="x1" values="{x0};{x1}" dur="14s" repeatCount="indefinite"/>
                  <animate attributeName="x2" values="{x0};{x1}" dur="14s" repeatCount="indefinite"/>
                </line>

                <!-- hour labels -->
                <g font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#8d7b94" text-anchor="middle">
              {labels}    </g>

                <text x="1030" y="238" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#5a4a63" text-anchor="end">&#9656; remaining hours: fully automated</text>
              </svg>
              '''

          hist = commit_histogram()
          pathlib.Path("assets/active-hours.svg").write_text(build_svg(hist), encoding="utf-8")
          print("histogram (IST):", dict((h, c) for h, c in enumerate(hist) if c))
          PY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit refreshed chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/active-hours.svg
          if git diff --cached --quiet; then
            echo "No change to active-hours"
          else
            git commit -m "chore(live): refresh active hours from commits [skip ci]"
            git push
          fi
