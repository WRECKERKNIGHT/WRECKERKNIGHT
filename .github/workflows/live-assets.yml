name: Live Assets

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-assets
  cancel-in-progress: true

jobs:
  tray:
    name: Bottom system tray (Spotify + telemetry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build tray bar
        run: python3 scripts/gen_bottom_bar.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit refreshed tray
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/bottom-bar.svg
          if git diff --cached --quiet; then
            echo "No change to tray"
          else
            git commit -m "chore(live): refresh bottom system tray [skip ci]"
            git push
          fi

  telemetry:
    name: Coding telemetry (real counted numbers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build rolling telemetry card + hours banner + contribution grid
        run: |
          python3 scripts/gen_coding_stats.py
          python3 scripts/gen_hours_banner.py
          python3 scripts/gen_contribution_chart.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit refreshed telemetry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/coding-stats.svg assets/hours-banner.svg assets/contribution-grid.svg
          if git diff --cached --quiet; then
            echo "No change to telemetry"
          else
            git commit -m "chore(live): refresh coding telemetry [skip ci]"
            git push
          fi
