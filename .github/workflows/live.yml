name: Live Assets

on:
  schedule:
    - cron: "0 */3 * * *" # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-assets
  cancel-in-progress: true

jobs:
  ticker:
    name: Status ticker refresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build live status ticker
        run: |
          python3 - <<'PY'
          import json, urllib.request, datetime, pathlib

          USER = "WRECKERKNIGHT"

          def get(url):
              req = urllib.request.Request(url, headers={
                  "User-Agent": "live-assets",
                  "Accept": "application/vnd.github+json",
              })
              return json.load(urllib.request.urlopen(req))

          user = get(f"https://api.github.com/users/{USER}")

          repos, page = [], 1
          while True:
              batch = get(f"https://api.github.com/users/{USER}/repos?per_page=100&page={page}")
              if not batch:
                  break
              repos.extend(batch)
              page += 1

          stars = sum(r["stargazers_count"] for r in repos)
          forks = sum(r["forks_count"] for r in repos)
          now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M")

          base = (f" SYSTEM.STATUS: ONLINE \u25c6 REPOS: {user['public_repos']}"
                  f" \u25c6 TOTAL.STARS: {stars}"
                  f" \u25c6 FORKS: {forks}"
                  f" \u25c6 FOLLOWERS: {user['followers']}"
                  f" \u25c6 FULL-STACK x AI x 3D"
                  f" \u25c6 SHIP.IT.THEN.POLISH.IT.THEN.AUTOMATE.IT"
                  f" \u25c6 LAST.SYNC: {now} UTC \u25c6")

          text = base * 3
          esc = text.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="52" viewBox="0 0 1440 52" role="img" aria-label="Live status ticker">
            <rect width="1440" height="52" fill="#0d1117"/>
            <line x1="0" y1="1" x2="1440" y2="1" stroke="#F700FF" stroke-opacity="0.6"/>
            <line x1="0" y1="51" x2="1440" y2="51" stroke="#00E5FF" stroke-opacity="0.6"/>
            <clipPath id="clip"><rect width="1440" height="52"/></clipPath>
            <g clip-path="url(#clip)" font-family="'Courier New',monospace" font-size="19" font-weight="bold">
              <g>
                <text x="0" y="34" fill="#00E5FF">{esc}</text>
                <animateTransform attributeName="transform" type="translate" from="0 0" to="-1440 0" dur="26s" repeatCount="indefinite"/>
              </g>
              <g>
                <text x="1440" y="34" fill="#00E5FF">{esc}</text>
                <animateTransform attributeName="transform" type="translate" from="0 0" to="-1440 0" dur="26s" repeatCount="indefinite"/>
              </g>
            </g>
          </svg>
          '''

          pathlib.Path("assets/status-ticker.svg").write_text(svg, encoding="utf-8")
          print(f"ticker refreshed -> stars={stars} forks={forks} followers={user['followers']} repos={user['public_repos']} sync={now}")
          PY

      - name: Commit refreshed ticker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/status-ticker.svg
          if git diff --cached --quiet; then
            echo "No changes to ticker"
          else
            git commit -m "chore(live): refresh status ticker [skip ci]"
            git push
          fi
