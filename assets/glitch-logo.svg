<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="WRECKERKNIGHT glitch logo">
  <defs>
    <linearGradient id="gcard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#12101c"/>
    </linearGradient>
    <clipPath id="cardclip"><rect x="6" y="6" width="1188" height="198" rx="24"/></clipPath>
  </defs>

  <rect x="6" y="6" width="1188" height="198" rx="24" fill="url(#gcard)" stroke="#232134" stroke-width="2"/>

  <g clip-path="url(#cardclip)" font-family="'Courier New',ui-monospace,monospace" font-weight="900" font-size="88" letter-spacing="14" text-anchor="middle">
    <!-- chromatic aberration layers -->
    <text x="600" y="122" fill="#F700FF" opacity="0.85">
      WRECKERKNIGHT
      <animate attributeName="x" values="600;592;606;597;600" dur="0.9s" calcMode="discrete" repeatCount="indefinite"/>
      <animate attributeName="y" values="122;124;119;125;122" dur="1.3s" calcMode="discrete" repeatCount="indefinite"/>
    </text>
    <text x="600" y="122" fill="#00E5FF" opacity="0.85">
      WRECKERKNIGHT
      <animate attributeName="x" values="600;608;594;603;600" dur="0.8s" calcMode="discrete" repeatCount="indefinite"/>
      <animate attributeName="y" values="122;119;126;120;122" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/>
    </text>
    <!-- base layer with flicker -->
    <text x="600" y="122" fill="#f4f4f0">
      WRECKERKNIGHT
      <animate attributeName="opacity" values="1;1;0.82;1;1;0.9;1" dur="3.7s" repeatCount="indefinite"/>
    </text>

    <!-- scanline tears -->
    <rect x="0" y="70" width="1200" height="3" fill="#ffffff" opacity="0.16">
      <animate attributeName="y" values="60;170;90;140;60" dur="2.7s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="130" width="1200" height="2" fill="#F700FF" opacity="0.25">
      <animate attributeName="y" values="150;80;160;110;150" dur="3.4s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="600" y="182" font-family="'Courier New',monospace" font-size="19" font-weight="bold" letter-spacing="6" text-anchor="middle" fill="#00E5FF">// SIGNAL.ACQUIRED &#183; BRAND.ONLINE</text>
</svg>
