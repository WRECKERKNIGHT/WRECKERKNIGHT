      <text x="505" y="34" font-size="19" font-weight="bold" fill="#00E5FF"> NOW PLAYING ▸ Post Malone — Circles ▸ SPOTIFY.LIVE ▸  NOW PLAYING ▸ Post Malone — Circles ▸ SPOTIFY.LIVE ▸ </text>
