      <rect x="404" y="23" width="5" height="23" fill="#F7B733" fill-opacity="1"><animate attributeName="height" values="23;5;23;19;5;5" dur="0.7s" begin="-0.09s" repeatCount="indefinite"/><animate attributeName="y" values="23;41;23;27;41;41" dur="0.7s" begin="-0.09s" repeatCount="indefinite"/></rect>
      <rect x="415" y="37" width="5" height="9" fill="#F7B733" fill-opacity="1"><animate attributeName="height" values="9;23;23;5;23;9" dur="1.01s" begin="-0.18s" repeatCount="indefinite"/><animate attributeName="y" values="37;23;23;41;23;37" dur="1.01s" begin="-0.18s" repeatCount="indefinite"/></rect>
      <rect x="426" y="23" width="5" height="23" fill="#F7B733" fill-opacity="1"><animate attributeName="height" values="23;19;9;19;23;14" dur="1.05s" begin="-0.27s" repeatCount="indefinite"/><animate attributeName="y" values="23;27;37;27;23;32" dur="1.05s" begin="-0.27s" repeatCount="indefinite"/></rect>
      <rect x="437" y="41" width="5" height="5" fill="#F7B733" fill-opacity="1"><animate attributeName="height" values="5;9;19;14;14;9" dur="0.76s" begin="-0.36s" repeatCount="indefinite"/><animate attributeName="y" values="41;37;27;32;32;37" dur="0.76s" begin="-0.36s" repeatCount="indefinite"/></rect>
