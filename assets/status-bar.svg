      <rect x="459" y="23" width="5" height="23" fill="#F7B733" fill-opacity="1"><animate attributeName="height" values="23;14;5;19;23;5" dur="1.14s" begin="-0.54s" repeatCount="indefinite"/><animate attributeName="y" values="23;32;41;27;23;41" dur="1.14s" begin="-0.54s" repeatCount="indefinite"/></rect>
