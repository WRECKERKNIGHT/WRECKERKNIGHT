<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 260">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E0A12"/>
      <stop offset="100%" stop-color="#1A1220"/>
    </linearGradient>
    <linearGradient id="peakBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#B98B56"/>
      <stop offset="100%" stop-color="#F7B733"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F7B733"/>
      <stop offset="100%" stop-color="#FAEDCD"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="5" y="5" width="1090" height="250" rx="26" fill="url(#bg2)" stroke="#2b2033" stroke-width="2"/>

  <!-- title -->
  <text x="70" y="54" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="38" font-weight="900" letter-spacing="7" fill="url(#txt)" filter="url(#glow)">ACTIVE HOURS</text>
  <text x="1030" y="50" font-family="ui-monospace,Menlo,monospace" font-size="20" letter-spacing="3" fill="#00E5FF" text-anchor="end">PEAK WINDOW 03:00 — 15:00</text>

  <line x1="70" y1="72" x2="1030" y2="72" stroke="#33253c" stroke-width="1"/>

  <!-- peak zone shading -->
  <rect x="182.5" y="84" width="490" height="128" fill="#F7B733" opacity="0.07" rx="8"/>

  <!-- grid lines -->
  <g stroke="#241A24" stroke-width="1">
    <line x1="60" y1="86" x2="60" y2="212"/>
    <line x1="305" y1="86" x2="305" y2="212"/>
    <line x1="550" y1="86" x2="550" y2="212"/>
    <line x1="795" y1="86" x2="795" y2="212"/>
    <line x1="1040" y1="86" x2="1040" y2="212"/>
  </g>
  <line x1="60" y1="212" x2="1040" y2="212" stroke="#3d2f45" stroke-width="1.5"/>

  <!-- dim off-window bars (00:00-03:00 left, 15:00-24:00 right) -->
  <g>
    <rect x="89.8" y="160" width="22" height="52" rx="6" fill="#3d2f45" opacity="0.55"/>
    <rect x="130.6" y="172" width="22" height="40" rx="6" fill="#3d2f45" opacity="0.55"/>
    <rect x="722.7" y="150" width="22" height="62" rx="6" fill="#3d2f45" opacity="0.55"/>
    <rect x="763.6" y="164" width="22" height="48" rx="6" fill="#3d2f45" opacity="0.55"/>
    <rect x="804.4" y="157" width="22" height="55" rx="6" fill="#3d2f45" opacity="0.55"/>
    <rect x="845.2" y="168" width="22" height="44" rx="6" fill="#3d2f45" opacity="0.55"/>
    <rect x="886.1" y="154" width="22" height="58" rx="6" fill="#3d2f45" opacity="0.55"/>
    <rect x="926.9" y="162" width="22" height="50" rx="6" fill="#3d2f45" opacity="0.55"/>
    <rect x="967.8" y="146" width="22" height="66" rx="6" fill="#3d2f45" opacity="0.55"/>
    <rect x="1008.6" y="170" width="22" height="42" rx="6" fill="#3d2f45" opacity="0.55"/>
  </g>

  <!-- peak window bars (03:00-15:00) -->
  <g filter="url(#glow)">
    <rect x="191.9" y="100" width="22" height="112" rx="6" fill="url(#peakBar)"><animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></rect>
    <rect x="232.8" y="108" width="22" height="104" rx="6" fill="url(#peakBar)"><animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" begin="0.08s" repeatCount="indefinite"/></rect>
    <rect x="273.6" y="116" width="22" height="96" rx="6" fill="url(#peakBar)"><animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" begin="0.16s" repeatCount="indefinite"/></rect>
    <rect x="314.4" y="104" width="22" height="108" rx="6" fill="url(#peakBar)"><animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" begin="0.24s" repeatCount="indefinite"/></rect>
    <rect x="355.3" y="112" width="22" height="100" rx="6" fill="url(#peakBar)"><animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" begin="0.32s" repeatCount="indefinite"/></rect>
    <rect x="396.1" y="120" width="22" height="92" rx="6" fill="url(#peakBar)"><animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></rect>
    <rect x="436.9" y="102" width="22" height="110" rx="6" fill="url(#peakBar)"><animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" begin="0.48s" repeatCount="indefinite"/></rect>
    <rect x="477.8" y="110" width="22" height="102" rx="6" fill="url(#peakBar)"><animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" begin="0.56s" repeatCount="indefinite"/></rect>
    <rect x="518.6" y="118" width="22" height="94" rx="6" fill="url(#peakBar)"><animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" begin="0.64s" repeatCount="indefinite"/></rect>
    <rect x="559.4" y="106" width="22" height="106" rx="6" fill="url(#peakBar)"><animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" begin="0.72s" repeatCount="indefinite"/></rect>
    <rect x="600.2" y="114" width="22" height="98" rx="6" fill="url(#peakBar)"><animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></rect>
    <rect x="641.1" y="122" width="22" height="90" rx="6" fill="url(#peakBar)"><animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" begin="0.88s" repeatCount="indefinite"/></rect>
  </g>

  <!-- sweeping now-cursor -->
  <line y1="86" y2="212" stroke="#00E5FF" stroke-width="2" opacity="0.7" filter="url(#glow)">
    <animate attributeName="x1" values="60;1040" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="60;1040" dur="14s" repeatCount="indefinite"/>
  </line>

  <!-- hour labels -->
  <g font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#8d7b94" text-anchor="middle">
    <text x="80.4" y="238">00</text>
    <text x="202.9" y="238" fill="#F7B733" font-weight="700">03</text>
    <text x="325.4" y="238">06</text>
    <text x="570.4" y="238">12</text>
    <text x="692.9" y="238" fill="#F7B733" font-weight="700">15</text>
    <text x="815.4" y="238">18</text>
  </g>

  <!-- footer -->
  <text x="1030" y="238" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#5a4a63" text-anchor="end">▸ remaining hours: fully automated</text>
</svg>
