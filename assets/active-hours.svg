<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 260">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E0A12"/>
      <stop offset="100%" stop-color="#1A1220"/>
    </linearGradient>
    <linearGradient id="peakBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#B98B56"/>
      <stop offset="100%" stop-color="#F7B733"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F7B733"/>
      <stop offset="100%" stop-color="#FAEDCD"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="5" y="5" width="1090" height="250" rx="26" fill="url(#bg2)" stroke="#2b2033" stroke-width="2"/>

  <text x="70" y="54" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="38" font-weight="900" letter-spacing="7" fill="url(#txt)" filter="url(#glow)">ACTIVE HOURS</text>
  <text x="1030" y="50" font-family="ui-monospace,Menlo,monospace" font-size="20" letter-spacing="3" fill="#00E5FF" text-anchor="end">ESTIMATED FROM COMMITS &#183; N=161</text>

  <line x1="70" y1="72" x2="1030" y2="72" stroke="#33253c" stroke-width="1"/>

  <!-- peak zone shading 15:00-03:00 -->
  <rect x="60" y="84" width="122.5" height="128" fill="#F7B733" opacity="0.07" rx="8"/>
  <rect x="672.5" y="84" width="367.5" height="128" fill="#F7B733" opacity="0.07" rx="8"/>

  <!-- grid lines -->
  <g stroke="#241A24" stroke-width="1">
    <line x1="60" y1="86" x2="60" y2="212"/>
    <line x1="305" y1="86" x2="305" y2="212"/>
    <line x1="550" y1="86" x2="550" y2="212"/>
    <line x1="795" y1="86" x2="795" y2="212"/>
    <line x1="1040" y1="86" x2="1040" y2="212"/>
  </g>
  <line x1="60" y1="212" x2="1040" y2="212" stroke="#3d2f45" stroke-width="1.5"/>

  <!-- hourly commit volume (IST), synced 24.08 -->
  <g filter="url(#glow)" id="bars">
    <rect x="69.0" y="96" width="22" height="116" rx="6" fill="url(#peakBar)"><animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></rect>
    <rect x="109.8" y="129" width="22" height="83" rx="6" fill="url(#peakBar)"><animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" begin="0.11s" repeatCount="indefinite"/></rect>
    <rect x="150.7" y="166" width="22" height="46" rx="6" fill="url(#peakBar)"><animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" begin="0.22s" repeatCount="indefinite"/></rect>
    <rect x="191.5" y="176" width="22" height="36" rx="6" fill="#3d2f45" opacity="0.55"></rect>
    <rect x="232.3" y="186" width="22" height="26" rx="6" fill="#3d2f45" opacity="0.55"></rect>
    <rect x="273.2" y="186" width="22" height="26" rx="6" fill="#3d2f45" opacity="0.55"></rect>
    <rect x="314.0" y="186" width="22" height="26" rx="6" fill="#3d2f45" opacity="0.55"></rect>
    <rect x="354.8" y="186" width="22" height="26" rx="6" fill="#3d2f45" opacity="0.55"></rect>
    <rect x="395.7" y="186" width="22" height="26" rx="6" fill="#3d2f45" opacity="0.55"></rect>
    <rect x="436.5" y="178" width="22" height="34" rx="6" fill="#3d2f45" opacity="0.55"></rect>
    <rect x="477.3" y="180" width="22" height="32" rx="6" fill="#3d2f45" opacity="0.55"></rect>
    <rect x="518.2" y="174" width="22" height="38" rx="6" fill="#3d2f45" opacity="0.55"></rect>
    <rect x="559.0" y="182" width="22" height="30" rx="6" fill="#3d2f45" opacity="0.55"></rect>
    <rect x="599.8" y="184" width="22" height="28" rx="6" fill="#3d2f45" opacity="0.55"></rect>
    <rect x="640.7" y="186" width="22" height="26" rx="6" fill="#3d2f45" opacity="0.55"></rect>
    <rect x="681.5" y="182" width="22" height="30" rx="6" fill="url(#peakBar)"><animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" begin="0.33s" repeatCount="indefinite"/></rect>
    <rect x="722.3" y="186" width="22" height="26" rx="6" fill="url(#peakBar)"><animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" begin="0.44s" repeatCount="indefinite"/></rect>
    <rect x="763.2" y="164" width="22" height="48" rx="6" fill="url(#peakBar)"><animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" begin="0.55s" repeatCount="indefinite"/></rect>
    <rect x="804.0" y="176" width="22" height="36" rx="6" fill="url(#peakBar)"><animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" begin="0.66s" repeatCount="indefinite"/></rect>
    <rect x="844.8" y="178" width="22" height="34" rx="6" fill="url(#peakBar)"><animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" begin="0.77s" repeatCount="indefinite"/></rect>
    <rect x="885.7" y="174" width="22" height="38" rx="6" fill="url(#peakBar)"><animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" begin="0.88s" repeatCount="indefinite"/></rect>
    <rect x="926.5" y="174" width="22" height="38" rx="6" fill="url(#peakBar)"><animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" begin="0.99s" repeatCount="indefinite"/></rect>
    <rect x="967.3" y="163" width="22" height="49" rx="6" fill="url(#peakBar)"><animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" begin="1.1s" repeatCount="indefinite"/></rect>
    <rect x="1008.2" y="168" width="22" height="44" rx="6" fill="url(#peakBar)"><animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" begin="1.21s" repeatCount="indefinite"/></rect>
  </g>

  <!-- sweeping now-cursor -->
  <line y1="86" y2="212" stroke="#00E5FF" stroke-width="2" opacity="0.7" filter="url(#glow)">
    <animate attributeName="x1" values="60;1040" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="60;1040" dur="14s" repeatCount="indefinite"/>
  </line>

  <!-- hour labels -->
  <g font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#8d7b94" text-anchor="middle">
    <text x="80.4" y="238">00</text>
    <text x="202.9" y="238" fill="#F7B733" font-weight="700">03</text>
    <text x="325.4" y="238">06</text>
    <text x="447.9" y="238">09</text>
    <text x="570.4" y="238">12</text>
    <text x="692.9" y="238" fill="#F7B733" font-weight="700">15</text>
    <text x="815.4" y="238">18</text>
    <text x="937.9" y="238">21</text>
  </g>

  <text x="1030" y="238" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#5a4a63" text-anchor="end">&#9656; remaining hours: fully automated</text>
</svg>
