<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E0A12"/>
      <stop offset="100%" stop-color="#1A1220"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7B733"/>
      <stop offset="60%" stop-color="#D4A373"/>
      <stop offset="100%" stop-color="#8A5F3D"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F7B733"/>
      <stop offset="100%" stop-color="#FAEDCD"/>
    </linearGradient>
    <filter id="glow3" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="5" y="5" width="790" height="420" rx="26" fill="url(#bg2)" stroke="#2b2033" stroke-width="2"/>

  <!-- ring + ticks -->
  <circle cx="400" cy="200" r="150" fill="none" stroke="#241A24" stroke-width="1.5"/>
  <circle cx="400" cy="200" r="140" fill="none" stroke="#3d2f45" stroke-width="1"/>
  <g stroke="#B98B56">
    <line x1="400.0" y1="74.0" x2="400.0" y2="50.0" stroke-width="2.2" opacity="0.9"/>
    <line x1="432.6" y1="78.3" x2="438.8" y2="55.1" stroke-width="1" opacity="0.45"/>
    <line x1="463.0" y1="90.9" x2="475.0" y2="70.1" stroke-width="1" opacity="0.45"/>
    <line x1="489.1" y1="110.9" x2="506.1" y2="93.9" stroke-width="2.2" opacity="0.9"/>
    <line x1="509.1" y1="137.0" x2="529.9" y2="125.0" stroke-width="1" opacity="0.45"/>
    <line x1="521.7" y1="167.4" x2="544.9" y2="161.2" stroke-width="1" opacity="0.45"/>
    <line x1="526.0" y1="200.0" x2="550.0" y2="200.0" stroke-width="2.2" opacity="0.9"/>
    <line x1="521.7" y1="232.6" x2="544.9" y2="238.8" stroke-width="1" opacity="0.45"/>
    <line x1="509.1" y1="263.0" x2="529.9" y2="275.0" stroke-width="1" opacity="0.45"/>
    <line x1="489.1" y1="289.1" x2="506.1" y2="306.1" stroke-width="2.2" opacity="0.9"/>
    <line x1="463.0" y1="309.1" x2="475.0" y2="329.9" stroke-width="1" opacity="0.45"/>
    <line x1="432.6" y1="321.7" x2="438.8" y2="344.9" stroke-width="1" opacity="0.45"/>
    <line x1="400.0" y1="326.0" x2="400.0" y2="350.0" stroke-width="2.2" opacity="0.9"/>
    <line x1="367.4" y1="321.7" x2="361.2" y2="344.9" stroke-width="1" opacity="0.45"/>
    <line x1="337.0" y1="309.1" x2="325.0" y2="329.9" stroke-width="1" opacity="0.45"/>
    <line x1="310.9" y1="289.1" x2="293.9" y2="306.1" stroke-width="2.2" opacity="0.9"/>
    <line x1="290.9" y1="263.0" x2="270.1" y2="275.0" stroke-width="1" opacity="0.45"/>
    <line x1="278.3" y1="232.6" x2="255.1" y2="238.8" stroke-width="1" opacity="0.45"/>
    <line x1="274.0" y1="200.0" x2="250.0" y2="200.0" stroke-width="2.2" opacity="0.9"/>
    <line x1="278.3" y1="167.4" x2="255.1" y2="161.2" stroke-width="1" opacity="0.45"/>
    <line x1="290.9" y1="137.0" x2="270.1" y2="125.0" stroke-width="1" opacity="0.45"/>
    <line x1="310.9" y1="110.9" x2="293.9" y2="93.9" stroke-width="2.2" opacity="0.9"/>
    <line x1="337.0" y1="90.9" x2="325.0" y2="70.1" stroke-width="1" opacity="0.45"/>
    <line x1="367.4" y1="78.3" x2="361.2" y2="55.1" stroke-width="1" opacity="0.45"/>
  </g>

  <!-- night arc 23:00 → 03:00 (through midnight at top, 60°) -->
  <path d="M 363.8 64.8 A 140 140 0 0 1 499 101" fill="none" stroke="url(#arc)" stroke-width="14" stroke-linecap="round" filter="url(#glow3)">
    <animate attributeName="stroke-opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M 363.8 64.8 A 140 140 0 0 1 499 101" fill="none" stroke="#FAEDCD" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>

  <!-- moon dot travelling the night arc -->
  <g>
    <circle r="9" fill="#F7B733" opacity="0.35">
      <animateMotion dur="8s" repeatCount="indefinite" path="M 363.8 64.8 A 140 140 0 0 1 499 101"/>
    </circle>
    <circle r="5" fill="#FAEDCD">
      <animateMotion dur="8s" repeatCount="indefinite" path="M 363.8 64.8 A 140 140 0 0 1 499 101"/>
    </circle>
  </g>

  <!-- hour labels -->
  <g font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#8d7b94" text-anchor="middle">
    <text x="400" y="42">00</text>
    <text x="560" y="204">06</text>
    <text x="400" y="368">12</text>
    <text x="240" y="204">18</text>
    <text x="363.8" y="46" fill="#F7B733" font-weight="700">23</text>
    <text x="524" y="116" fill="#F7B733" font-weight="700">03</text>  </g>

  <!-- center -->
  <text x="400" y="168" font-family="ui-monospace,Menlo,monospace" font-size="17" letter-spacing="4" fill="#8d7b94" text-anchor="middle">MOST ACTIVE</text>
  <text x="400" y="206" font-family="ui-monospace,Menlo,monospace" font-size="34" font-weight="800" fill="url(#txt)" text-anchor="middle">NIGHT OWL</text>
  <text x="400" y="242" font-family="ui-monospace,Menlo,monospace" font-size="22" fill="#00E5FF" text-anchor="middle">23:00 — 03:00</text>

  <!-- stars -->
  <g fill="#FAEDCD">
    <path d="M 120 90 l 4 10 l 10 4 l -10 4 l -4 10 l -4 -10 l -10 -4 l 10 -4 Z">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 690 120 l 3 7 l 7 3 l -7 3 l -3 7 l -3 -7 l -7 -3 l 7 -3 Z">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.7s" repeatCount="indefinite"/>
    </path>
    <path d="M 160 330 l 3 7 l 7 3 l -7 3 l -3 7 l -3 -7 l -7 -3 l 7 -3 Z">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- footer -->
  <text x="400" y="404" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#5a4a63" text-anchor="middle">● offline during daylight hours ●</text>
</svg>
