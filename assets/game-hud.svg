<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 545">
  <defs>
    <linearGradient id="hudBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#150D1A"/>
      <stop offset="100%" stop-color="#0E0A12"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F700FF"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#F7B733"/>
    </linearGradient>
    <linearGradient id="xpGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F700FF"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F7B733"/>
      <stop offset="100%" stop-color="#D4A373"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0096FF"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#27C93F"/>
      <stop offset="100%" stop-color="#00A86B"/>
    </linearGradient>
    <linearGradient id="magenta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F700FF"/>
      <stop offset="100%" stop-color="#B700E5"/>
    </linearGradient>
    <filter id="glow2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="5" y="5" width="990" height="535" rx="26" fill="url(#hudBg)" stroke="url(#neon)" stroke-width="3"/>
  <rect x="18" y="18" width="964" height="509" rx="18" fill="none" stroke="#2b2033" stroke-width="1.5"/>

  <!-- header -->
  <rect x="48" y="44" width="64" height="64" rx="32" fill="url(#gold)" filter="url(#glow2)"/>
  <text x="80" y="87" font-family="ui-monospace,Menlo,monospace" font-size="28" font-weight="700" fill="#150D1A" text-anchor="middle">WK</text>
  <text x="140" y="70" font-family="ui-monospace,Menlo,monospace" font-size="26" font-weight="700" fill="#FAEDCD">PLAYER: WRECKERKNIGHT</text>
  <text x="140" y="98" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#8d7b94">class: full-stack / ai / 3d</text>
  <text x="840" y="72" font-family="ui-monospace,Menlo,monospace" font-size="30" font-weight="700" fill="#F7B733">LVL 27</text>
  <rect x="840" y="86" width="104" height="24" rx="6" fill="#27C93F22" stroke="#27C93F" stroke-width="1.5"/>
  <text x="892" y="104" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#27C93F" text-anchor="middle">▶ LIVE</text>
  <circle cx="1016" cy="60" r="4" fill="#27C93F">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </circle>

  <!-- XP bar -->
  <text x="48" y="152" font-family="ui-monospace,Menlo,monospace" font-size="18" fill="#FAEDCD">XP → LVL 28</text>
  <text x="930" y="152" font-family="ui-monospace,Menlo,monospace" font-size="18" fill="#FF6B35" text-anchor="end">78%</text>
  <rect x="48" y="162" width="904" height="22" rx="11" fill="#241A24" stroke="#3d2f45" stroke-width="1.5"/>
  <rect x="50" y="164" width="900" height="18" rx="9" fill="url(#xpGrad)" opacity="0.9">
    <animate attributeName="width" values="0;702" dur="1.6s" fill="freeze"/>
  </rect>

  <!-- stat bars -->
  <g font-family="ui-monospace,Menlo,monospace" font-size="16">
    <text x="48" y="222" fill="#00E5FF">⚔ ATK</text>
    <rect x="160" y="210" width="560" height="12" rx="6" fill="#241A24" stroke="#2b2033" stroke-width="1"/>
    <rect x="161" y="211" width="558" height="10" rx="5" fill="url(#cyan)">
      <animate attributeName="width" values="0;492" begin="0.3s" dur="1.2s" fill="freeze"/>
    </rect>
    <text x="760" y="222" fill="#00E5FF">88%</text>

    <text x="48" y="260" fill="#F7B733">🛡 DEF</text>
    <rect x="160" y="248" width="560" height="12" rx="6" fill="#241A24" stroke="#2b2033" stroke-width="1"/>
    <rect x="161" y="249" width="558" height="10" rx="5" fill="url(#gold)">
      <animate attributeName="width" values="0;453" begin="0.5s" dur="1.2s" fill="freeze"/>
    </rect>
    <text x="760" y="260" fill="#F7B733">81%</text>

    <text x="48" y="298" fill="#F700FF">⚡ SPD</text>
    <rect x="160" y="286" width="560" height="12" rx="6" fill="#241A24" stroke="#2b2033" stroke-width="1"/>
    <rect x="161" y="287" width="558" height="10" rx="5" fill="url(#magenta)">
      <animate attributeName="width" values="0;402" begin="0.7s" dur="1.2s" fill="freeze"/>
    </rect>
    <text x="760" y="298" fill="#F700FF">72%</text>

    <text x="48" y="336" fill="#27C93F">🧠 BRAIN</text>
    <rect x="160" y="324" width="560" height="12" rx="6" fill="#241A24" stroke="#2b2033" stroke-width="1"/>
    <rect x="161" y="325" width="558" height="10" rx="5" fill="url(#green)">
      <animate attributeName="width" values="0;530" begin="0.9s" dur="1.2s" fill="freeze"/>
    </rect>
    <text x="760" y="336" fill="#27C93F">95%</text>
  </g>

  <!-- achievements -->
  <text x="48" y="380" font-family="ui-monospace,Menlo,monospace" font-size="18" fill="#FAEDCD">ACHIEVEMENTS</text>

  <g font-family="ui-monospace,Menlo,monospace">
    <rect x="48" y="394" width="290" height="70" rx="12" fill="#241A24" stroke="#F7B733" stroke-width="1.5"/>
    <text x="66" y="422" font-size="17" fill="#FAEDCD">🚀 SHIP IT</text>
    <text x="66" y="448" font-size="13" fill="#B98B56">unlocked · style-your-looks</text>

    <rect x="355" y="394" width="290" height="70" rx="12" fill="#241A24" stroke="#F7B733" stroke-width="1.5"/>
    <text x="373" y="422" font-size="17" fill="#FAEDCD">🤖 AI WHISPERER</text>
    <text x="373" y="448" font-size="13" fill="#B98B56">unlocked · mediapipe + llm</text>

    <rect x="662" y="394" width="290" height="70" rx="12" fill="#241A24" stroke="#F7B733" stroke-width="1.5"/>
    <text x="680" y="422" font-size="17" fill="#FAEDCD">🐳 DOCKER MASTER</text>
    <text x="680" y="448" font-size="13" fill="#B98B56">unlocked · it compiles now</text>

    <rect x="48" y="472" width="290" height="56" rx="12" fill="#161019" stroke="#2b2033" stroke-width="1.5"/>
    <text x="66" y="500" font-size="15" fill="#8d7b94">👑 OPEN SOURCE · 37%</text>

    <rect x="355" y="472" width="290" height="56" rx="12" fill="#161019" stroke="#2b2033" stroke-width="1.5"/>
    <text x="373" y="500" font-size="15" fill="#8d7b94">🏆 HACKATHON · 12%</text>

    <rect x="662" y="472" width="290" height="56" rx="12" fill="#161019" stroke="#F700FF" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="680" y="500" font-size="15" fill="#F700FF">🌙 NIGHT OWL · 98%</text>
  </g>
</svg>
